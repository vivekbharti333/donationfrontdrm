<div class="table-footer">
  <div class="dataTables_length">
    <label>

    </label>
  </div>
  <div class="pagination">
    <div class="entries"> Showing
      {{ limit }}  of
      {{ totalData }} Results
    </div>
    <div class="col-sm-12 col-md-7">
      <div class="pagination_section">
        <ul class="pagination">
          <li class="page-item" [ngClass]="{
              disabled: currentPage === 1
            }">
            <a (click)="getMoreData('previous')" class="page-link" href="javascript:void(0);" tabindex="-1"><i
                class="fa fa-angle-left"></i></a>


          </li>

        
          @for (item of visiblePageItems; track $index) {
            @if (item !== 'ellipsis') {
              <li class="page-item" [class.active]="item === currentPage">
                <a (click)="moveToPage(item)" class="page-link" href="javascript:void(0);">
                  {{ item }}
                </a>
              </li>
            } @else {
              <li class="page-item disabled">
                <span class="page-link">...</span>
              </li>
            }
          }

          <li class="page-item" [ngClass]="{
              disabled:
                currentPage === pageNumberArray[pageNumberArray.length - 1] ||
                tableData.length === 0
            }">
            <a (click)="getMoreData('next')" class="page-link" href="javascript:void(0);"><i
                class="fa fa-angle-right"></i>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
