<form [formGroup]="addStudentForm" (ngSubmit)="submitStudentForm()">


  
  <!-- ================= STUDENT DETAILS ================= -->
  <div class="card mb-3">
    <div class="card-body">
      <div class="new-employee-field">
        <div class="card-title-head">
          <h6><span><i class="feather icon-info feather-edit"></i></span>Student Information</h6>
        </div>
      </div>


      <div class="profile-pic-upload student-photo-upload">

    <div class="profile-pic">

        <ng-container *ngIf="!addStudentForm.get('studentPicture')?.value; else imagePreview">
            <span>
                <i class="feather icon-plus-circle"></i>
                Profile Photo
            </span>
        </ng-container>

        <ng-template #imagePreview>
    <img
        [src]="addStudentForm.get('studentPicture')?.value"
        alt="Student photo preview"
        class="uploaded-profile-pic"
    >
</ng-template>

    </div>

    <div class="photo-actions">
        <!-- Gallery Upload -->
        <label class="btn btn-primary photo-action-btn">
            <i class="feather icon-image me-1"></i>
            Upload From Gallery
            <input
                type="file"
                hidden
                accept="image/*"
                (change)="onFileSelected($event)"
            >
        </label>

        <!-- Camera Capture -->
        <button type="button" class="btn btn-success photo-action-btn" (click)="openCamera()">
            <i class="feather icon-camera me-1"></i>
            Take Live Photo
        </button>
        <small class="photo-help">JPG or PNG. You can upload a photo or take one now.</small>
    </div>

</div>

      <div class="row">
        <div class="col-md-4 mb-3">
          <label>Admission No *</label>
          <input class="form-control" formControlName="admissionNo">
        </div>

        <div class="col-md-4 mb-3">
          <label>Roll Number *</label>
          <input class="form-control" formControlName="rollNumber">
        </div>

        <div class="col-md-2 mb-3">
          <label>Grade *</label>
           <select class="form-control" formControlName="grade">
            <option value="">{{ isGradesLoading ? 'Loading grades...' : 'Select Grade' }}</option>
            <option *ngFor="let grade of gradeOptions" [value]="grade.gradeName || grade.name || grade.id">
              {{ grade.gradeName || grade.name || ('Grade ' + grade.id) }}
            </option>
          </select>
        </div>

        <div class="col-md-2 mb-3">
          <label>Grade Section</label>
          <!-- <input class="form-control" formControlName="gradeSection"> -->
           <select class="form-control" formControlName="gradeSection">
            <option value="">Select Section</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
            <option value="E">E</option>
          </select>
        </div>

        <div class="col-md-4 mb-3">
          <label>First Name *</label>
          <input class="form-control" formControlName="firstName">
        </div>

        <div class="col-md-4 mb-3">
          <label>Middle Name</label>
          <input class="form-control" formControlName="middleName">
        </div>

        <div class="col-md-4 mb-3">
          <label>Last Name *</label>
          <input class="form-control" formControlName="lastName">
        </div>

        <div class="col-md-4 mb-3">
          <label>Date of Birth</label>
          <input type="date" class="form-control" formControlName="dob">
        </div>

        <div class="col-md-4 mb-3">
          <label>Birth Place</label>
          <input class="form-control" formControlName="dobPlace">
        </div>

        <div class="col-md-4 mb-3">
          <label>Gender</label>
          <select class="form-control" formControlName="gender">
            <option value="">Select</option>
            <option>Male</option>
            <option>Female</option>
          </select>
        </div>

        <div class="col-md-4 mb-3">
          <label>Blood Group</label>
          <input class="form-control" formControlName="bloodGroup">
        </div>

        <div class="col-md-4 mb-3">
          <label>Nationality</label>
          <input class="form-control" formControlName="nationality">
        </div>

        <div class="col-md-4 mb-3">
          <label>Category</label>
          <input class="form-control" formControlName="category">
        </div>

        <div class="col-md-4 mb-3">
          <label>Religion</label>
          <input class="form-control" formControlName="religion">
        </div>

        <div class="col-md-4 mb-3">
          <label>Aadhaar No</label>
          <input class="form-control" formControlName="aadharNumber">
        </div>

        <div class="col-md-4 mb-3">
          <label>Birth Certificate No</label>
          <input class="form-control" formControlName="birthCertificateNumber">
        </div>

        <div class="col-md-4 mb-3">
          <label>PEN</label>
          <input class="form-control" formControlName="permanentEducationNumber">
        </div>

        <div class="col-md-4 mb-3">
          <label>Shiksha Unique ID</label>
          <input class="form-control" formControlName="eShikshaUniqueId">
        </div>

        <div class="col-md-4 mb-3">
          <label>Session</label>
          <select class="form-select" formControlName="sessionName"><option value="">Select academic year</option><option *ngFor="let year of academicYearOptions" [value]="year.value">{{ year.name }}</option></select>
        </div>

        <div class="col-md-4 mb-3">
          <label>Sibling Admission No</label>
          <input class="form-control" formControlName="siblingAdmissionNumber">
        </div>
      </div>
    </div>
  </div>

  <!-- ================= PARENTS DETAILS ================= -->
  <div class="card mb-3">
    <div class="card-body">
      <div class="new-employee-field">
        <div class="card-title-head">
          <h6><span><i class="feather icon-info feather-edit"></i></span>Parents Information</h6>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label>Father Name *</label>
          <input class="form-control" formControlName="fatherName">
        </div>

        <div class="col-md-6 mb-3">
          <label>Father Mobile</label>
          <input class="form-control" formControlName="fatherMobileNo">
        </div>

        <div class="col-md-6 mb-3">
          <label>Mother Name</label>
          <input class="form-control" formControlName="motherName">
        </div>

        <div class="col-md-6 mb-3">
          <label>Mother Mobile</label>
          <input class="form-control" formControlName="motherMobileNo">
        </div>
      </div>
    </div>
  </div>

  <!-- ================= CURRENT ADDRESS ================= -->
  <div class="card mb-3">
    <div class="card-body">
      <!-- <h6></h6> -->
      <div class="new-employee-field">
        <div class="card-title-head">
          <h6><span><i class="feather icon-info feather-edit"></i></span>Current Address</h6>
        </div>
      </div>

      <textarea class="form-control mb-2" formControlName="currentAddress"></textarea>

      <div class="row">
        <div class="col-md-4 mb-3">
          <input class="form-control" placeholder="City" formControlName="currentCity">
        </div>
        <div class="col-md-4 mb-3">
          <input class="form-control" placeholder="State" formControlName="currentState">
        </div>
        <div class="col-md-4 mb-3">
          <input class="form-control" placeholder="PIN" formControlName="currentPin">
        </div>
      </div>
    </div>
  </div>

  <!-- ================= PERMANENT ADDRESS ================= -->
  <div class="card mb-3">
    <div class="card-body">
      <!-- <h6>Permanent Address</h6> -->
      <div class="new-employee-field">
        <div class="card-title-head permanent-address-heading">
          <h6><span><i class="feather icon-info feather-edit"></i></span>Permanent Address</h6>
          <label class="same-address-check">
            <input type="checkbox" [checked]="sameAsCurrentAddress"
              (change)="onSameAddressChange($any($event.target).checked)">
            <span>Same as Current Address</span>
          </label>
        </div>
      </div>

      <textarea class="form-control mb-2" formControlName="permanentAddress"></textarea>

      <div class="row">
        <div class="col-md-4 mb-3">
          <input class="form-control" placeholder="City" formControlName="permanentCity">
        </div>
        <div class="col-md-4 mb-3">
          <input class="form-control" placeholder="State" formControlName="permanentState">
        </div>
        <div class="col-md-4 mb-3">
          <input class="form-control" placeholder="PIN" formControlName="permanentPin">
        </div>
      </div>
    </div>
  </div>

  <!-- ================= PREVIOUS SCHOOL ================= -->
  <div class="card mb-3">
    <div class="card-body">
      <!-- <h6>Previous School</h6> -->
      <div class="new-employee-field">
        <div class="card-title-head">
          <h6><span><i class="feather icon-info feather-edit"></i></span>Previous School Information</h6>
        </div>
      </div>
      <div class="row">
        <div class="col-md-4 mb-3">
          <label>Previous School</label>
          <input class="form-control" formControlName="previousSchool">
        </div>
        <div class="col-md-4 mb-3">
          <label>Reason for Change</label>
          <input class="form-control" formControlName="reasonForChange">
        </div>
        <div class="col-md-4 mb-3">
          <label>Last Class Attended</label>
          <input class="form-control" formControlName="lastClassAttended">
        </div>
      </div>  
      <!-- <input class="form-control mb-2" placeholder="Previous School" formControlName="previousSchool"> -->
      <!-- <input class="form-control mb-2" placeholder="Reason for Change" formControlName="reasonForChange"> -->
      <!-- <input class="form-control" placeholder="Last Class Attended" formControlName="lastClassAttended"> -->
    </div>
  </div>

  <!-- ================= SUBMIT ================= -->
  <div class="student-form-actions">
    <div class="save-help">
      <i class="feather icon-info"></i>
      <span>Please review the student information before saving.</span>
    </div>
    <button type="submit" class="btn btn-primary save-student-btn">
      <i class="feather icon-save"></i>
      <span>Save Student</span>
    </button>
  </div>

</form>

<div class="camera-backdrop" *ngIf="isCameraOpen" (click)="closeCamera()">
  <div class="camera-dialog" role="dialog" aria-modal="true" aria-labelledby="camera-title"
    (click)="$event.stopPropagation()">
    <div class="camera-header">
      <h5 id="camera-title">Take Live Photo</h5>
      <button type="button" class="camera-close" aria-label="Close camera" (click)="closeCamera()">&times;</button>
    </div>

    <div class="camera-viewport">
      <video #cameraVideo *ngIf="!capturedPhoto && !cameraError" autoplay muted playsinline></video>
      <button type="button" class="camera-flip" *ngIf="!capturedPhoto && !cameraError"
        [disabled]="isSwitchingCamera" (click)="switchCamera()" aria-label="Switch between front and rear camera"
        title="Flip camera">
        <i class="feather icon-refresh-cw"></i>
        <span>{{ isSwitchingCamera ? 'Switching...' : 'Flip camera' }}</span>
      </button>
      <img *ngIf="capturedPhoto" [src]="capturedPhoto" alt="Captured student photo">
      <div class="camera-error" *ngIf="cameraError">
        <i class="feather icon-camera-off"></i>
        <p>{{ cameraError }}</p>
      </div>
    </div>

    <div class="camera-actions" [class.has-captured-photo]="capturedPhoto">
      <button type="button" class="btn btn-light" (click)="closeCamera()">Cancel</button>
      <button type="button" class="btn btn-success" *ngIf="!capturedPhoto && !cameraError"
        (click)="capturePhoto()">
        <i class="feather icon-camera me-1"></i>Capture Photo
      </button>
      <button type="button" class="btn btn-outline-secondary" *ngIf="capturedPhoto" (click)="retakePhoto()">
        Retake
      </button>
      <button type="button" class="btn btn-primary" *ngIf="capturedPhoto" (click)="useCapturedPhoto()">
        Use Photo
      </button>
      <button type="button" class="btn btn-primary" *ngIf="cameraError" (click)="openCamera()">
        Try Again
      </button>
    </div>
  </div>
</div>
